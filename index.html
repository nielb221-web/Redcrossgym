<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Red Cross Gym — Total Business CRM, Attendance, ID Card & Invoice Suite</title>
  <meta name="theme-color" content="#d9202e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- Tailwind CSS CDN for responsive adaptive utilities -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Inter Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- jsPDF & PDF.js for Invoice / ID Card Generation and Bill Parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

  <style>
    :root {
      --bg: #f4f5f8;
      --card: #ffffff;
      --card-alt: #f9fafb;
      --tx: #141519;
      --mut: #646876;
      --red: #d9202e;
      --red-dark: #a5141f;
      --bd: #e2e4ec;
      --ok: #12a150;
      --warn: #d98a00;
      --blue: #2563eb;
      --purple: #7c3aed;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    html[data-theme="dark"] {
      --bg: #0e1014;
      --card: #171920;
      --card-alt: #1f222b;
      --tx: #f3f4f6;
      --mut: #9499a6;
      --bd: #282c37;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font: 14px/1.45 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .w { max-width: 1280px; margin: 0 auto; padding: 14px; }

    header.app-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: var(--card);
      border-bottom: 3px solid var(--red);
      position: sticky;
      top: 0;
      z-index: 30;
      flex-wrap: wrap;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    }

    button, .btn {
      background: var(--red);
      color: #fff;
      border: 0;
      border-radius: 10px;
      padding: 9px 15px;
      font-weight: 600;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    button:hover, .btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
    button:active, .btn:active { transform: translateY(0); }
    button.g, .btn.g {
      background: var(--card-alt);
      color: var(--tx);
      border: 1px solid var(--bd);
    }
    button.g:hover { border-color: var(--red); }
    button.sm { padding: 5px 10px; font-size: 12px; border-radius: 8px; }

    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--bd);
      border-radius: 10px;
      background: var(--card-alt);
      color: var(--tx);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(217, 32, 46, 0.15);
    }

    label {
      font-size: 12px;
      font-weight: 600;
      color: var(--mut);
      display: block;
      margin: 10px 0 4px;
    }

    .box {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.04);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 10px;
      margin: 12px 0;
    }

    .stat {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 14px;
      padding: 12px;
      text-align: center;
      transition: all 0.15s ease;
    }
    .stat.on { outline: 2px solid var(--red); background: rgba(217,32,46,0.06); }
    .stat b { font-size: 22px; display: block; font-weight: 800; }
    .stat span { font-size: 11px; color: var(--mut); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }

    .grid-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 14px;
      margin-top: 12px;
    }

    .id {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .id:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(0,0,0,0.18);
    }
    .id .top {
      background: linear-gradient(135deg, #9e0e1a, #e3283a);
      color: #fff;
      padding: 9px 14px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .id .bd { display: flex; gap: 12px; padding: 14px; align-items: center; }
    .ph {
      width: 74px;
      height: 92px;
      border-radius: 10px;
      background: var(--bd);
      object-fit: cover;
      flex: none;
      border: 2px solid var(--bd);
    }
    .id h3 { margin: 0 0 3px; font-size: 16px; font-weight: 800; }
    .id p { margin: 0; color: var(--mut); font-size: 12px; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
    }
    .bar {
      height: 6px;
      background: var(--bd);
      margin: 0 14px 12px;
      border-radius: 9px;
      overflow: hidden;
    }
    .bar i { display: block; height: 100%; border-radius: 9px; }
    .days {
      padding: 0 14px 8px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .days b { font-size: 18px; font-weight: 800; }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(4px);
      display: grid;
      place-items: center;
      padding: 14px;
      z-index: 60;
      overflow-y: auto;
    }
    .modal .box {
      width: 100%;
      max-width: 560px;
      max-height: 92vh;
      overflow-y: auto;
      animation: popIn 0.18s ease-out;
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.96) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .msg { font-size: 12.5px; color: var(--mut); margin-top: 6px; }
    .err { color: #f87171; font-weight: 600; }

    /* Table styling */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .data-table th {
      text-align: left;
      padding: 10px 10px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--mut);
      background: var(--card-alt);
      border-bottom: 2px solid var(--bd);
      white-space: nowrap;
    }
    .data-table td {
      padding: 10px 10px;
      border-bottom: 1px solid var(--bd);
      vertical-align: middle;
    }
    .data-table tr:hover td {
      background: rgba(217, 32, 46, 0.03);
    }

    /* Special Column Highlights */
    .col-idcard { background: rgba(217, 32, 46, 0.04); border-left: 2px solid rgba(217, 32, 46, 0.25); }
    .col-att { background: rgba(18, 161, 80, 0.04); border-left: 2px solid rgba(18, 161, 80, 0.25); }
    .col-staff { background: rgba(37, 99, 235, 0.04); border-left: 2px solid rgba(37, 99, 235, 0.25); }
    .col-owner { background: rgba(124, 58, 237, 0.05); border-left: 2px solid rgba(124, 58, 237, 0.3); }

    /* KPI Cards */
    .kgrid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
      gap: 12px;
      margin: 10px 0;
    }
    .kc {
      border-radius: 16px;
      padding: 15px;
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 3px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.16);
      position: relative;
      overflow: hidden;
    }
    .kc small { opacity: 0.9; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
    .kc b { font-size: 23px; font-weight: 900; letter-spacing: -0.02em; }
    .kc em { font-size: 11.5px; opacity: 0.9; font-style: normal; }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 99px;
      padding: 6px 13px;
      font-size: 12.5px;
      font-weight: 600;
    }

    .nav-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 10px 16px;
      background: var(--card);
      border-bottom: 1px solid var(--bd);
      position: sticky;
      top: 57px;
      z-index: 25;
    }
    .nav-tabs button {
      white-space: nowrap;
      padding: 8px 15px;
      border-radius: 99px;
      font-size: 13px;
    }

    .two-col {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 14px;
    }

    .pcg {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 12px;
    }
    .pcd {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      transition: border-color 0.15s;
    }
    .pcd:hover { border-color: var(--red); }

    /* Toast container */
    #toast-wrap {
      position: fixed;
      bottom: 18px;
      right: 18px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 360px;
    }
    .toast-item {
      background: var(--card);
      color: var(--tx);
      border-left: 4px solid var(--red);
      border-top: 1px solid var(--bd);
      border-right: 1px solid var(--bd);
      border-bottom: 1px solid var(--bd);
      padding: 12px 16px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: popIn 0.2s ease-out;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="toast-wrap"></div>

  <script>
    /* ============================================================================
       1. CONFIGURATION, UTILITIES & NON-BLOCKING UI DIALOGS (NO ALERT/CONFIRM)
       ============================================================================ */
    window.RCG_API = "https://script.google.com/macros/s/AKfycbykxXy_Pl-aVSvDwsvz5LypKS0VUYFr5bfwr6Ef8OCDab5y9eH7VRCpqiAHvvheiT4q/exec";

    const $ = s => document.querySelector(s);
    const $$ = s => Array.from(document.querySelectorAll(s));
    const app = $("#app");

    const ls = {
      g: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
      s: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }
    };

    const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const pd = s => {
      const m = /(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s || "");
      return m ? new Date(+m[3], m[2] - 1, +m[1]) : null;
    };
    const fmt = d => d ? d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }) : "–";
    const toGB = d => {
      const pad = n => String(n).padStart(2, "0");
      return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
    };
    const iso = d => {
      const pad = n => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    };
    const todayS = () => iso(new Date());
    const inr = n => "₹" + Math.round(+n || 0).toLocaleString("en-IN");
    const R2 = n => "Rs. " + (+n || 0).toFixed(2);
    const sum = (arr, key = "amount") => arr.reduce((a, b) => a + (+b[key] || 0), 0);
    const pad4 = n => String(n).padStart(4, "0");
    const addD = (t, n) => { const x = new Date(t + "T00:00:00"); x.setDate(x.getDate() + n); return iso(x); };
    const difD = (x, y) => Math.round((new Date(y + "T00:00:00") - new Date(x + "T00:00:00")) / 864e5);
    const dm = t => t ? t.split("-").reverse().join("/") : "";
    const shortNum = n => {
      const abs = Math.abs(n);
      const sign = n < 0 ? "-" : "";
      if (abs >= 1e5) return sign + "₹" + (abs / 1e5).toFixed(2) + "L";
      if (abs >= 1e3) return sign + "₹" + (abs / 1e3).toFixed(abs >= 1e4 ? 1 : 1) + "k";
      return sign + "₹" + Math.round(abs);
    };

    // Custom Toast Notification (replaces alert())
    function toast(message, type = "ok") {
      const wrap = $("#toast-wrap");
      if (!wrap) return;
      const el = document.createElement("div");
      const colors = { ok: "#12a150", err: "#d9202e", warn: "#d98a00", info: "#2563eb" };
      const icons = { ok: "fa-circle-check", err: "fa-circle-exclamation", warn: "fa-triangle-exclamation", info: "fa-circle-info" };
      el.className = "toast-item";
      el.style.borderLeftColor = colors[type] || colors.ok;
      el.innerHTML = `<i class="fa-solid ${icons[type] || icons.ok}" style="color:${colors[type] || colors.ok};font-size:16px"></i><span>${esc(message)}</span>`;
      wrap.appendChild(el);
      setTimeout(() => {
        el.style.opacity = "0";
        el.style.transition = "opacity 0.25s";
        setTimeout(() => el.remove(), 260);
      }, 3400);
    }

    // Custom Modal Helper
    function modal(html, maxWidth = "560px") {
      const d = document.createElement("div");
      d.className = "modal";
      d.innerHTML = `<div class="box" style="max-width:${maxWidth}">${html}</div>`;
      d.onclick = e => { if (e.target === d) d.remove(); };
      document.body.appendChild(d);
      return d;
    }

    // Custom Confirm Dialog (replaces confirm())
    function askConfirm(title, message, onYes, confirmLabel = "Confirm") {
      const d = modal(`
        <h3 style="margin:0 0 6px;font-size:18px;font-weight:800">${esc(title)}</h3>
        <p class="msg" style="font-size:14px;margin-bottom:16px">${esc(message)}</p>
        <div style="display:flex;gap:10px;justify-content:flex-end">
          <button class="g" id="cf-no">Cancel</button>
          <button id="cf-yes">${esc(confirmLabel)}</button>
        </div>
      `, "400px");
      d.querySelector("#cf-no").onclick = () => d.remove();
      d.querySelector("#cf-yes").onclick = () => { d.remove(); onYes(); };
    }

    // Automatically derive sales records from existing member bills so Dashboard, Charts & Sales tables are never empty when members exist
    function autoSyncSalesFromMembers() {
      if (!Array.isArray(members) || !members.length) return;
      const existingRefs = new Set((C.sales || []).map(s => s.ref || (s.memberId + "-" + s.bill)));
      const existingBills = new Set((C.sales || []).map(s => String(s.bill || "").trim()).filter(Boolean));
      const derived = [];

      members.forEach((m, idx) => {
        if (!m) return;
        const paidAmt = +String(m.paid || m.total || 0).replace(/[^0-9.-]/g, "") || 0;
        const dueAmt = +String(m.due || 0).replace(/[^0-9.-]/g, "") || 0;
        const totAmt = +String(m.total || paidAmt).replace(/[^0-9.-]/g, "") || paidAmt;
        const discAmt = +String(m.disc || 0).replace(/[^0-9.-]/g, "") || 0;
        if (paidAmt <= 0 && totAmt <= 0) return;

        const refKey = "b" + (m.id || m.bio) + "-" + (m.bill || "");
        const billStr = String(m.bill || "").trim();
        if (existingRefs.has(refKey) || (billStr && existingBills.has(billStr))) return;

        const parsedDate = pd(m.billDate) || pd(m.start) || (m.added ? new Date(+m.added) : new Date());
        const dateISO = parsedDate && !isNaN(parsedDate) ? iso(parsedDate) : todayS();

        derived.push({
          id: "auto-" + (m.id || idx) + "-" + (billStr || idx),
          date: dateISO,
          customer: m.name || "Member",
          phone: m.phone || "",
          memberId: m.id || "",
          bio: String(m.bio || ""),
          item: m.plan || "Gym Membership",
          type: /personal training|pt/i.test(m.plan || "") ? "PT" : "Membership",
          price: +(m.price || totAmt) || totAmt,
          discount: discAmt,
          reg: +(m.reg || 0) || 0,
          total: totAmt,
          amount: paidAmt,
          due: dueAmt,
          mode: m.mode === "Online" ? "UPI" : (m.mode || "UPI"),
          staff: m.staff || "Owner Direct",
          ownerStatus: m.ownerStatus || "Verified ✔",
          ownerNote: m.ownerNote || "",
          ref: refKey,
          bill: billStr || String(idx + 1),
          inv: billStr ? "RCG-" + pad4(billStr) : "RCG-" + pad4(idx + 1),
          start: m.start || "",
          end: m.end || "",
          rtype: m.renewed ? "Renewal" : "Enrollment"
        });
      });

      if (derived.length) {
        C.sales = (C.sales || []).concat(derived);
      }
    }

    async function api(body) {

    function unpackCrmFromServer(rawCrm) {
      const crm = { sales: [], expenses: [], packages: [], staff: [], pt: [], leads: [], ...(rawCrm || {}) };
      const ptStaff = (crm.pt || []).filter(x => x && x._isStaff);
      const explicitStaff = crm.staff || [];
      const staffMap = {};
      [...(C.staff || []), ...explicitStaff, ...ptStaff].forEach(s => { if (s && s.id) staffMap[s.id] = s; });
      crm.staff = Object.values(staffMap);
      crm.pt = (crm.pt || []).filter(x => !x || !x._isStaff);
      return crm;
    }

    /* ============================================================================

    function adt(x) {
      const [a, b] = String(x).split(" ");
      const [y, mo, d] = a.split("-").map(Number);
      const [h, mi] = (b || "08:00").split(":").map(Number);
      return new Date(y, mo - 1, d, h, mi);
    }

    function fmtA(x) {
      const d = adt(x);
      return [
        d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }),
        d.toLocaleDateString("en-GB", { weekday: "short" }),
        d.toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit", hour12: true })
      ];
    }

    function astats(list) {
      const pad = n => String(n).padStart(2, "0");
      const key = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
      const ds = (list || []).map(x => x.slice(0, 10));
      const set = new Set(ds);
      const now = new Date();
      const ym = now.getFullYear() + "-" + pad(now.getMonth() + 1);
      let c = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const today = set.has(key(c));
      if (!today) c.setDate(c.getDate() - 1);
      let streak = 0;
      while (set.has(key(c))) {
        streak++;
        c.setDate(c.getDate() - 1);
      }
      return {
        month: ds.filter(x => x.startsWith(ym)).length,
        streak,
        total: set.size,
        today,
        last: list && list.length ? list.slice().sort().reverse()[0] : null
      };
    }

      const stamp = `${iso(now)} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
      const list = (attm[memberId] || []).slice();

      list.push(stamp);

    /* ============================================================================
       7. INTERACTIVE SVG CHARTS & GRAPHS ENGINE
       ============================================================================ */
    const rng = () => {
      const n = new Date(), y = n.getFullYear(), m = n.getMonth();
      let f, t = todayS();
      if (R.k === "today") f = t;
      else if (R.k === "week") { const w = new Date(); w.setDate(w.getDate() - 6); f = iso(w); }
      else if (R.k === "month") f = iso(new Date(y, m, 1));
      else if (R.k === "year") f = iso(new Date(y, 0, 1));
      else if (R.k === "all") f = "2020-01-01";
      else { f = R.from || iso(new Date(y, m, 1)); t = R.to || t; }
      return [f, t];
    };
    const inR = (x, r) => x.date >= r[0] && x.date <= r[1];
    const daysIn = r => {
      if (R.k === "all") {
        const dates = [...C.sales.map(x => x.date), ...C.expenses.map(x => x.date)].sort();
        if (!dates.length) return 30;
        return Math.max(1, difD(dates[0], todayS()) + 1);
      }
      return Math.max(1, difD(r[0], r[1]) + 1);
    };

    const svgGrid = (W, H, L, mx) => [0, 0.25, 0.5, 0.75, 1].map(f => {
      const y = H - f * H;
      return `<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="currentColor" opacity=".12"/>
              <text x="${L - 6}" y="${y + 3}" font-size="9" text-anchor="end" fill="currentColor" opacity=".65">${shortNum(mx * f)}</text>`;
    }).join("");

    function chartBars(rows) {
      if (!rows.length) return '<p class="msg">No chart data in this period.</p>';
      const W = 660, H = 190, L = 52, n = rows.length;
      const mx = Math.max(1, ...rows.flatMap(r => [r[1], r[2]]));
      const bw = (W - L) / n, w = Math.max(3, Math.min(22, bw * 0.36));
      return `<svg viewBox="0 0 ${W} ${H + 24}" style="width:100%;height:auto">${svgGrid(W, H, L, mx)}` +
        rows.map((r, i) => {
          const x = L + i * bw + bw / 2 - w - 0.5, h1 = (r[1] / mx) * H, h2 = (r[2] / mx) * H;
          return `<rect x="${x}" y="${H - h1}" width="${w}" height="${h1}" fill="#d9202e" rx="3"><title>${r[0]} — Sales: ${inr(r[1])}</title></rect>
                  <rect x="${x + w + 1.5}" y="${H - h2}" width="${w}" height="${h2}" fill="#64748b" rx="3"><title>${r[0]} — Expenses: ${inr(r[2])}</title></rect>` +
                  (i % Math.ceil(n / 12) === 0 ? `<text x="${x + w}" y="${H + 15}" font-size="9.5" text-anchor="middle" fill="currentColor" opacity=".75">${r[0]}</text>` : "");
        }).join("") + "</svg>";
    }

    function chartArea(rows) {
      if (!rows.length) return '<p class="msg">No trend data in this period.</p>';
      const W = 660, H = 175, L = 52, n = rows.length;
      const mx = Math.max(1, ...rows.map(r => r[1]));
      const st = n > 1 ? (W - L - 16) / (n - 1) : 0;
      const pt = rows.map((r, i) => [L + 8 + i * st, H - (r[1] / mx) * H]);
      const ln = pt.map(p => p.join(",")).join(" ");
      return `<svg viewBox="0 0 ${W} ${H + 24}" style="width:100%;height:auto">${svgGrid(W, H, L, mx)}
        <polygon points="${pt[0][0]},${H} ${ln} ${pt[n - 1][0]},${H}" fill="#d9202e" opacity=".18"/>
        <polyline points="${ln}" fill="none" stroke="#d9202e" stroke-width="2.6" stroke-linejoin="round"/>` +
        pt.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="${n > 35 ? 2 : 3.8}" fill="#d9202e"><title>${rows[i][0]}: ${inr(rows[i][1])}</title></circle>` +
          (i % Math.ceil(n / 12) === 0 ? `<text x="${p[0]}" y="${H + 15}" font-size="9.5" text-anchor="middle" fill="currentColor" opacity=".75">${rows[i][0]}</text>` : "")).join("") + "</svg>";
    }

    function chartDonut(it) {
      const t = it.reduce((a, b) => a + b[1], 0), P = 2 * Math.PI * 58;
      let a = 0;
      return `<svg viewBox="0 0 160 160" style="width:145px;flex:none">` +
        (t ? it.map((x, i) => {
          const l = (x[1] / t) * P;
          const c = `<circle r="58" cx="80" cy="80" fill="none" stroke="${COL[i % COL.length]}" stroke-width="22" stroke-dasharray="${l} ${P - l}" stroke-dashoffset="${-a}" transform="rotate(-90 80 80)"><title>${esc(x[0])}: ${inr(x[1])}</title></circle>`;
          a += l;
          return c;
        }).join("") : '<circle r="58" cx="80" cy="80" fill="none" stroke="currentColor" opacity=".1" stroke-width="22"/>') +
        `<text x="80" y="75" text-anchor="middle" font-size="10" fill="currentColor" opacity=".6">Total</text>
         <text x="80" y="93" text-anchor="middle" font-size="13.5" font-weight="800" fill="currentColor">${shortNum(t)}</text></svg>`;
    }

    const chartLegend = it => {
      const tot = it.reduce((a, b) => a + b[1], 0) || 1;
      return it.map((m, i) => `<div style="font-size:12.5px;margin:4px 0;display:flex;align-items:center;justify-content:space-between;gap:12px">
        <span><span style="color:${COL[i % COL.length]}">●</span> ${esc(m[0])}</span>
        <b>${inr(m[1])} <span style="color:var(--mut);font-weight:500">(${Math.round((m[1] / tot) * 100)}%)</span></b>
      </div>`).join("") || '<span class="msg">No data yet.</span>';
    };

    const dnBlock = it => `<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:10px">${chartDonut(it)}<div style="flex:1;min-width:160px">${chartLegend(it)}</div></div>`;

    function chartHBars(it) {
      const mx = Math.max(1, ...it.map(x => x[1]));
      return it.map((x, i) => `<div style="display:flex;align-items:center;gap:10px;margin:8px 0">
        <span style="width:155px;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(x[0])}">${esc(x[0])}</span>
        <div style="flex:1;background:var(--bd);border-radius:8px;height:14px;overflow:hidden">
          <div style="width:${(x[1] / mx) * 100}%;background:${COL[i % COL.length]};height:100%;border-radius:8px"></div>
        </div>
        <b style="font-size:12.5px;min-width:74px;text-align:right">${inr(x[1])}</b>
      </div>`).join("") || '<span class="msg">No data yet.</span>';
    }

    const grp = (a, k) => Object.entries(a.reduce((o, x) => {
      const key = x[k] || "Unassigned";
      o[key] = (o[key] || 0) + (+x.amount || 0);
      return o;
    }, {})).sort((a, b) => b[1] - a[1]);

    /* ============================================================================
       8. PERIOD FILTER BAR & DAY / MONTH / YEAR BREAKDOWN ENGINE
       ============================================================================ */
    const rb = () => {
      const b = (k, l) => `<button class="${R.k === k ? "" : "g"} sm" data-r="${k}" style="border-radius:99px;padding:7px 14px">${l}</button>`;

        ${b("today", "Today")}
        ${b("week", "Last 7 Days")}
        ${b("month", "This Month")}
        ${b("year", "This Year")}
        ${b("all", "All Time")}
        ${b("custom", "Custom Range 📅")}
        ${R.k === "custom" ? `
          <input type="date" data-rd="from" value="${r[0]}" style="width:auto;padding:5px 10px">
          <span class="msg" style="margin:0">to</span>

        ` : `<span class="msg" style="margin:0 0 0 auto;font-weight:600">${r[0]} → ${r[1]}</span>`}

    const kc = (l, v, sub, g) => `<div class="kc" style="background:linear-gradient(135deg,${g})"><small>${l}</small><b>${v}</b>${sub ? `<em>${sub}</em>` : ""}</div>`;
    const kg = a => `<div class="kgrid">${a.join("")}</div>`;
    const cd = (t, h, s) => `<div class="box" style="margin-top:14px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px"><b style="font-size:15px">${t}</b>${s ? `<span class="msg" style="margin:0">${s}</span>` : ""}</div>${h}</div>`;

    // View 1: Total Business Analysis & Executive Dashboard
    function viewDashboard() {
      const r = rng();
      const S = C.sales.filter(x => inR(x, r));
      const E = C.expenses.filter(x => inR(x, r));
      const d = daysIn(r);
      const ts = sum(S, "amount");
      const te = sum(E, "amount");
      const net = ts - te;
      const margin = ts > 0 ? ((net / ts) * 100).toFixed(1) + "%" : "0%";
      const totalDues = sum(members, "due");
      const activeCount = members.filter(m => info(m).st[0] === "Active").length;

      const t = todayS(), ymStr = t.slice(0, 7), yr = t.slice(0, 4);
      const todaySales = sum(C.sales.filter(x => x.date === t));
      const todayExp = sum(C.expenses.filter(x => x.date === t));
      const monthSales = sum(C.sales.filter(x => x.date.slice(0, 7) === ymStr));
      const monthExp = sum(C.expenses.filter(x => x.date.slice(0, 7) === ymStr));
      const yearSales = sum(C.sales.filter(x => x.date.slice(0, 4) === yr));
      const yearExp = sum(C.expenses.filter(x => x.date.slice(0, 4) === yr));

      const rows = [], ym = [];
      if (d <= 62) {
        const startD = R.k === "all" ? addD(t, -29) : r[0];
        const loopD = R.k === "all" ? 30 : d;
        for (let i = 0; i < loopD; i++) {
          const k = addD(startD, i);
          rows.push([k.slice(5), sum(S.filter(x => x.date === k)), sum(E.filter(x => x.date === k))]);
        }
      } else {
        const ms = {};
        S.forEach(x => { const k = x.date.slice(0, 7); (ms[k] = ms[k] || [k, 0, 0])[1] += +x.amount; });
        E.forEach(x => { const k = x.date.slice(0, 7); (ms[k] = ms[k] || [k, 0, 0])[2] += +x.amount; });
        rows.push(...Object.keys(ms).sort().map(k => ms[k]));
      }

      for (let i = 1; i <= 12; i++) {
        const k = yr + "-" + String(i).padStart(2, "0");
        ym.push([
          ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"][i - 1],
          sum(C.sales.filter(x => x.date.slice(0, 7) === k)),
          sum(C.expenses.filter(x => x.date.slice(0, 7) === k))

          <span class="chip"><i class="fa-solid fa-chart-line" style="color:var(--purple)"></i> ${yr} Year Sale: <b style="color:var(--ok)">${inr(yearSales)}</b> | Net: <b>${inr(yearSales - yearExp)}</b></span>
          <button class="g sm" style="margin-left:auto" onclick="mainTab='breakdown';render()"><i class="fa-solid fa-table-list"></i> Full Day/Month/Year Table</button>
        </div>

        ${rb()}

        <!-- Total Business Analysis KPI Grid -->
        ${kg([
          kc("Total Sales Revenue", inr(ts), `${S.length} invoices in period`, "#d9202e, #990f19"),
          kc("Total Expenses", inr(te), `${E.length} vouchers logged`, "#475569, #1e293b"),
          kc("Net Profit / Cashflow", inr(net), `Profit Margin: ${margin}`, net < 0 ? "#b91c1c, #7f1d1d" : "#0f9d58, #065f46"),
          kc("Per Day Avg Sale", inr(ts / d), `Avg Exp/Day: ${inr(te / d)}`, "#2563eb, #1e40af"),
          kc("Pending Member Dues", inr(totalDues), `${members.filter(x => +x.due > 0).length} members with balance`, "#d98a00, #92400e"),
          kc("Owner Verified / Settled", inr(settledSum), `${activeCount}/${members.length} Active Members`, "#7c3aed, #4c1d95")
        ])}

        <div class="two-col">
          ${cd("📈 Daily / Period Sales Revenue Trend", chartArea(rows), `${r[0]} to ${r[1]}`)}
          ${cd("📊 Sales vs. Expenses Comparison", chartBars(rows), `<span style="color:#d9202e">■</span> Sales &nbsp; <span style="color:#64748b">■</span> Expenses`)}
        </div>

        <div class="two-col">
          ${cd("💳 Revenue by Payment Mode", dnBlock(grp(S, "mode")), "UPI / Cash / Card")}
          ${cd("🧾 Expense Breakdown by Category", dnBlock(grp(E, "category")), "Where money goes")}
        </div>

        <div class="two-col">
          ${cd("🏆 Best-Selling Gym & PT Packages", chartHBars(grp(S, "item").slice(0, 6)), "Top revenue generators")}

    // View 2: Per Day / Per Month / Per Year Financial Breakdown View
    function viewBreakdown() {
      // Group all sales and expenses by day, month, and year
      const groupPeriod = (sliceLen) => {
        const map = {};
        C.sales.forEach(s => {
          const k = (s.date || todayS()).slice(0, sliceLen);
          if (!map[k]) map[k] = { period: k, sCount: 0, sales: 0, disc: 0, due: 0, exp: 0, eCount: 0, staffSet: new Set(), settled: 0 };
          map[k].sCount++;
          map[k].sales += (+s.amount || 0);
          map[k].disc += (+s.discount || 0);
          map[k].due += (+s.due || 0);
          if (s.staff) map[k].staffSet.add(s.staff);
          if (s.ownerStatus === "Settled to Owner" || s.ownerStatus === "Verified ✔") map[k].settled += (+s.amount || 0);
        });
        C.expenses.forEach(e => {
          const k = (e.date || todayS()).slice(0, sliceLen);
          if (!map[k]) map[k] = { period: k, sCount: 0, sales: 0, disc: 0, due: 0, exp: 0, eCount: 0, staffSet: new Set(), settled: 0 };
          map[k].eCount++;
          map[k].exp += (+e.amount || 0);
          if (e.staff) map[k].staffSet.add(e.staff);
        });
        return Object.values(map).sort((a, b) => b.period.localeCompare(a.period));
      };

      const sliceLen = breakdownMode === "day" ? 10 : breakdownMode === "month" ? 7 : 4;
      const rows = groupPeriod(sliceLen);
      const totSales = rows.reduce((a, b) => a + b.sales, 0);
      const totExp = rows.reduce((a, b) => a + b.exp, 0);
      const totNet = totSales - totExp;

      return `
        <div class="box">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px">
            <div>
              <h2 style="margin:0;font-size:18px;font-weight:800">📊 Per Day / Month / Year Sales &amp; Expense Breakdown</h2>
              <p class="msg" style="margin:2px 0 0">Complete chronological ledger with Staff attribution and Owner settlement tracking</p>
            </div>
            <div style="display:flex;gap:6px">
              <button class="${breakdownMode === 'day' ? '' : 'g'}" onclick="breakdownMode='day';render()">📅 Per Day Data</button>
              <button class="${breakdownMode === 'month' ? '' : 'g'}" onclick="breakdownMode='month';render()">🗓️ Per Month Data</button>
              <button class="${breakdownMode === 'year' ? '' : 'g'}" onclick="breakdownMode='year';render()">📈 Per Year Data</button>
            </div>
          </div>

          ${kg([
            kc(`Total Sales (${breakdownMode.toUpperCase()})`, inr(totSales), `${rows.length} active ${breakdownMode}s`, "#d9202e, #990f19"),
            kc(`Total Expenses (${breakdownMode.toUpperCase()})`, inr(totExp), `Avg ${inr(totExp / Math.max(1, rows.length))} / ${breakdownMode}`, "#475569, #1e293b"),
            kc(`Net Profit (${breakdownMode.toUpperCase()})`, inr(totNet), `Avg ${inr(totNet / Math.max(1, rows.length))} / ${breakdownMode}`, totNet >= 0 ? "#0f9d58, #065f46" : "#b91c1c, #7f1d1d")
          ])}

          <div style="overflow-x:auto;margin-top:12px">
            <table class="data-table">
              <thead>
                <tr>
                  <th>${breakdownMode === "day" ? "Date (YYYY-MM-DD)" : breakdownMode === "month" ? "Month (YYYY-MM)" : "Year (YYYY)"}</th>
                  <th>Invoices</th>
                  <th>Total Sales (Paid)</th>
                  <th>Discounts</th>
                  <th>Pending Dues</th>
                  <th>Expenses</th>
                  <th>Net Profit</th>
                  <th>Margin %</th>
                  <th class="col-staff">Staff Column (Handled By)</th>
                  <th class="col-owner">Owner Column (Verified/Settled)</th>
                </tr>
              </thead>
              <tbody>
                ${rows.map(r => {
                  const net = r.sales - r.exp;
                  const mg = r.sales > 0 ? Math.round((net / r.sales) * 100) + "%" : "–";
                  return `<tr>
                    <td><b>${esc(r.period)}</b></td>
                    <td>${r.sCount} sales · ${r.eCount} exp</td>
                    <td style="color:var(--ok);font-weight:700">${inr(r.sales)}</td>
                    <td>${r.disc ? inr(r.disc) : "–"}</td>
                    <td style="color:${r.due ? 'var(--red)' : 'var(--mut)'};font-weight:600">${r.due ? inr(r.due) : "₹0"}</td>
                    <td style="color:#f87171;font-weight:600">${inr(r.exp)}</td>
                    <td style="color:${net >= 0 ? 'var(--ok)' : 'var(--red)'};font-weight:800">${inr(net)}</td>
                    <td><span class="chip" style="padding:2px 8px;font-size:11px">${mg}</span></td>
                    <td class="col-staff"><span style="font-size:12px">${esc(Array.from(r.staffSet).join(", ") || "Owner Direct")}</span></td>
                    <td class="col-owner"><b style="color:var(--purple)">${inr(r.settled)}</b> <span class="msg">settled</span></td>
                  </tr>`;
                }).join("")}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function toggleStaffAttendance(stId) {
      const st = (C.staff || []).find(x => x.id === stId);

      st.presentToday = !st.presentToday;
      saveLocalState();
      toast(`${st.name} marked ${st.presentToday ? "Present ✔" : "Absent"}`, "ok");
      render();
    }

    function payStaffSalary(stId) {
      const st = (C.staff || []).find(x => x.id === stId);
      if (!st) return;
      askConfirm("Disburse Staff Salary", `Record salary payment of ${inr(st.salary)} to ${st.name} (${st.role}) in Expenses?`, async () => {
        await cputs("expenses", [{
          date: todayS(),
          category: "Salary",
          amount: +st.salary,
          mode: "UPI",
          staff: st.name,
          ownerStatus: "Settled to Owner",
          note: `Monthly Salary Paid to ${st.name} (${st.role})`
        }]);
        toast(`Salary of ${inr(st.salary)} logged for ${st.name} ✔`, "ok");
        render();
      }, "Pay & Log Expense");
    }

      const calc = () => {
        const price = +qEl("pr").value || 0, rf = +qEl("rf").value || 0, ds = qEl("dc").value.trim();
        let dc = ds.endsWith("%") ? (price * (parseFloat(ds) || 0)) / 100 : (+ds || 0);
        dc = Math.round(Math.min(Math.max(dc, 0), price) * 100) / 100;
        const grand = Math.max(0, price - dc + rf);
        const paid = qEl("pa").value === "" ? grand : +qEl("pa").value;
        const due = Math.max(0, Math.round((grand - paid) * 100) / 100);
        qEl("sum").innerHTML = `Sub-total: <b>${R2(price)}</b> · Discount: <b>${R2(dc)}</b> · Reg. Fee: <b>${R2(rf)}</b><br>

        return { price, dc, rf, grand, paid, due };
      };

      const setEnd = () => {
        if (qEl("jd").value && qEl("dy").value !== "") qEl("ed").value = addD(qEl("jd").value, +qEl("dy").value);

      qEl("ed").onchange = () => {

        if (!qEl("jd").value || !qEl("ed").value || qEl("ed").value < qEl("jd").value) {
          qEl("fe").textContent = "Please verify start and end dates"; return;
        }

        const bill = billNo();

          item: pn,
          type: /personal training/i.test(pn) ? "PT" : "Membership",
          amount: c.paid,
          discount: c.dc,
          due: c.due,
          reg: c.rf,
          price: c.price,
          total: c.grand,
          mode,
          staff: staffVal,
          ownerStatus: ownerVal,
          ownerNote: m && o.renew ? "Membership Renewal" : "New Enrollment",
          inv: "RCG-" + pad4(bill),

    function parseRcg(kw, t) {
      if (typeof kw === "string" && kw.indexOf("RCGDATA:") === 0) {
        try {
          const j = JSON.parse(decodeURIComponent(escape(atob(kw.slice(8)))));
          return {
            name: j.name || "", bio: String(j.bio || ""), phone: j.phone || "",
            bill: String(j.bill || ""), billDate: j.billDate || "", plan: j.plan || "",
            start: j.start || "", end: j.end || "", total: String(j.total ?? ""),
            paid: String(j.paid ?? ""), due: String(j.due ?? ""),
            _x: { price: String(j.price ?? ""), disc: String(j.disc ?? 0), reg: String(j.reg ?? 0), mode: j.mode || "Online" },
            _src: "data"
          };
        } catch (e) {}
      }
      const L = t.split("\n").map(x => x.trim()).filter(Boolean), J = L.join(" ");
      const g = (r, i) => (r.exec(J) || [])[i || 1] || "", D = "(\\d{1,2}\\/\\d{1,2}\\/\\d{4})";
      const bi = L.findIndex(x => /^BILL(ED)? TO/i.test(x)), nm = bi >= 0 ? L[bi + 1] : "";
      const pi = L.findIndex(x => /membership|personal training|trial/i.test(x) && !/non-|^\d+\.|must|required/i.test(x));
      const money = (...ks) => {
        for (const k of ks) {
          const m = new RegExp(k + "\\s*(?:Rs\\.?|₹)\\s*([\\d,]+(?:\\.\\d+)?)", "i").exec(J);
          if (m) return m[1].replace(/,/g, "");
        }
        return "";
      };
      const dr = new RegExp("(?:From|Valid from:?)\\s+" + D + "\\s+(?:till|to|Valid till:?)\\s+" + D, "i").exec(J) || [];
      const bill = g(/(?:Bill Number|Bill No):?\s*(\d+)/i) || g(/Invoice No:?\s*RCG-0*(\d+)/i);
      return {
        name: nm, bio: g(/BIO ID:?\s*(\d+)/i), phone: g(/BIO ID:?\s*\d+\s+(?:Phone:?\s*)?(\d{10})/i),
        bill, billDate: g(new RegExp("Bill Date:?\\s*" + D, "i")) || g(new RegExp("(?:Issued on|Date):?\\s*" + D, "i")),
        plan: pi >= 0 ? L[pi] : "", start: dr[1] || "", end: dr[2] || "",
        total: money("GRAND TOTAL"), paid: money("PAID AMOUNT", "Amount paid"), due: money("DUE AMOUNT", "BALANCE DUE"),
        _x: { price: money("SUB-TOTAL"), disc: money("DISCOUNT") || "0", reg: money("REGISTRATION FEE") || "0", mode: "Online" },
        _src: "text"
      };
    }

    async function readPdf(file) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";
      const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
      let t = "", kw = "";
      try { const md = await pdf.getMetadata(); kw = (md.info && md.info.Keywords) || ""; } catch (e) {}
      for (let p = 1; p <= pdf.numPages; p++) {
        const c = await (await pdf.getPage(p)).getTextContent();
        t += c.items.map(x => x.str).join("\n") + "\n";
      }
      return parseRcg(kw, t);
    }

    function tinyPhoto(file) {
      return new Promise((res, rej) => {
        const im = new Image();
        im.onload = () => {
          const W = 160, H = 200, cv = document.createElement("canvas");
          cv.width = W; cv.height = H;
          const x = cv.getContext("2d");
          const s = Math.max(W / im.width, H / im.height), w = im.width * s, h = im.height * s;
          x.drawImage(im, (W - w) / 2, (H - h) / 2, w, h);
          let q = 0.65, u = cv.toDataURL("image/jpeg", q);
          while (u.length > 9000 && q > 0.25) { q -= 0.1; u = cv.toDataURL("image/jpeg", q); }
          res(u);
        };
        im.onerror = rej;
        im.src = URL.createObjectURL(file);
      });
    }

    async function markFromMemberPortal(memberId, btn) {
      if (btn) { btn.disabled = true; btn.textContent = "Marking attendance…"; }
      const m = mmem.find(x => x.id === memberId) || members.find(x => x.id === memberId);
      if (m) {
        const st = info(m).st[0];
        if (st === "Expired") { toast("Membership expired. Please renew at the gym desk.", "err"); render(); return; }
        if (st === "Upcoming") { toast("Membership has not started yet.", "err"); render(); return; }
      }
      // Mark locally immediately
      const now = new Date();
      const pad = n => String(n).padStart(2, "0");
      const stamp = `${iso(now)} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
      const list = (attm[memberId] || (m && m.att) || []).slice();
      if (!list.some(x => x.startsWith(iso(now)))) {
        list.push(stamp);
      }
      attm[memberId] = list;
      if (m) m.att = list;
      ls.s("rcg_mcache", JSON.stringify(mmem));
      saveLocalState();

      // Sync to cloud in background if reachable
      try {
        const r = await api({ action: "attend", phone: mphone, id: memberId });
        if (r && Array.isArray(r.att)) {
          attm[memberId] = r.att;
          if (m) m.att = r.att;
          ls.s("rcg_mcache", JSON.stringify(mmem));
          saveLocalState();
        }
      } catch (e) {}
      toast("Attendance marked for today ✔", "ok");
      render();
    }

        mainTab = "members";
      }

      const hasFocus = document.activeElement && document.activeElement.id === "q";

      let bodyContent = "";
      if (mainTab === "dash") bodyContent = viewDashboard();
      else if (mainTab === "breakdown") bodyContent = viewBreakdown();
      else if (mainTab === "members") bodyContent = viewMembersAndIdCards(false);
      else if (mainTab === "attendance") bodyContent = viewAttendanceHub();
      else if (mainTab === "sales") bodyContent = viewSales();
      else if (mainTab === "expenses") bodyContent = viewExpenses();
      else if (mainTab === "packages") bodyContent = viewPackages();
      else if (mainTab === "invoices") bodyContent = viewInvoicesAndExpiries();
      else if (mainTab === "staff_owner") bodyContent = viewStaffAndOwner();
      else bodyContent = viewMembersAndIdCards(false);

      app.innerHTML = `
        <header class="app-header">
          ${brandLogoHTML(36)}

          <div style="display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap">
            <span class="chip" style="border-color:${role === 'owner' ? 'var(--red)' : 'var(--blue)'}">
              <i class="fa-solid ${role === 'owner' ? 'fa-crown' : 'fa-user-tie'}" style="color:${role === 'owner' ? 'var(--red)' : 'var(--blue)'}"></i>
              ${role === "owner" ? "Owner (Full Access)" : "Staff Portal"}
            </span>

            ${role === "staff" && C.staff && C.staff.length ? `
              <select style="width:auto;padding:5px 8px;font-size:12px" onchange="activeStaffName=this.value;toast('Active Staff: '+this.value,'info')">
                ${(C.staff || []).map(s => `<option ${activeStaffName.startsWith(s.name) ? "selected" : ""}>${esc(s.name)} (${esc(s.role)})</option>`).join("")}
              </select>
            ` : ""}

            ${role === "owner" ? `<button class="sm" onclick="saleInvoice()"><i class="fa-solid fa-plus"></i> + Sale / Invoice</button>` : ""}
            <button class="g sm" onclick="addView()"><i class="fa-solid fa-user-plus"></i> + Add Member</button>
            <button class="g sm" onclick="syncFromCloud(true)" title="Sync live data with Google Drive"><i class="fa-solid fa-arrows-rotate"></i> Sync</button>
            ${role === "owner" ? `
              <button class="g sm" onclick="exportBackupJson()" title="Download Full Backup JSON"><i class="fa-solid fa-download"></i> Backup</button>
              <button class="g sm" onclick="importBackupJsonModal()" title="Restore / Import Members JSON"><i class="fa-solid fa-upload"></i> Restore</button>
            ` : ""}
            <button class="g sm" onclick="toggleTheme()" title="Switch Dark / Light Theme"><i class="fa-solid fa-circle-half-stroke"></i></button>
            <button class="g sm" id="btn-logout" title="Log out"><i class="fa-solid fa-right-from-bracket"></i> Log out</button>
          </div>
        </header>

        <!-- Sticky Navigation Tabs -->
        <nav class="nav-tabs">
          ${allowedTabs.map(([k, label]) => `
            <button class="${mainTab === k ? "" : "g"}" data-nav="${k}">${label}</button>
          `).join("")}
        </nav>

        <main class="w">
          ${bodyContent}
        </main>
      `;

      // Bind Logout
      $("#btn-logout").onclick = () => {
        askConfirm("Log Out", "Are you sure you want to log out?", () => {
          ls.s("rcg_role", "");
          ls.s("rcg_cred", "");
          creds = null;
          role = null;
          render();
        }, "Log out");
      };

      // Bind Navigation
      $$("[data-nav]").forEach(b => {
        b.onclick = () => {
          mainTab = b.dataset.nav;
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        };
      });

      // Bind Period Filter buttons
      $$("[data-r]").forEach(b => {
        b.onclick = () => {
          const c = rng();
          R.k = b.dataset.r;
          if (R.k === "custom" && !R.from) { R.from = c[0]; R.to = c[1]; }
          render();
        };
      });
      $$("[data-rd]").forEach(i => {
        i.onchange = () => { R[i.dataset.rd] = i.value; render(); };
      });

      // Bind Member Filter & Cards
      $$("[data-f]").forEach(el => {
        el.onclick = () => { flt = el.dataset.f; render(); };
      });
      $$(".id[data-id]").forEach(el => {
        el.onclick = () => detail(el.dataset.id);
      });

      // Bind Search Input
      const qi = $("#q");
      if (qi) {
        qi.oninput = e => { q = e.target.value; render(); };
        if (hasFocus) {
          qi.focus();
          qi.setSelectionRange(q.length, q.length);
        }
      }

      // Bind Table Quick Search
      $$("[data-fs]").forEach(inp => {
        inp.oninput = () => {
          const term = inp.value.toLowerCase();
          $$("tr[data-s]").forEach(row => {
            row.style.display = row.dataset.s.includes(term) ? "" : "none";
          });
        };
      });

      tick();
    }

    function exportBackupJson() {
      const payload = { exportedAt: new Date().toISOString(), members, attendance: attm, crm: C };
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" }));
      a.download = "red-cross-gym-backup-" + todayS() + ".json";
      a.click();
      toast("Full gym backup JSON downloaded ✔", "ok");
    }

    function importBackupJsonModal() {
      const d = modal(`
        <h3 style="margin:0 0 6px;font-size:18px;font-weight:800">📂 Restore / Import Gym Backup (.json)</h3>
        <p class="msg" style="margin:0 0 12px">Select a Red Cross Gym backup <code>.json</code> file (either a member list array or full CRM backup) to upload into your Google Drive database.</p>
        <input type="file" id="imp-json" accept="application/json,.json">
        <div class="msg" id="imp-st"></div>
        <div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end">
          <button class="g" id="imp-cl">Close</button>
        </div>
      `, "460px");
      d.querySelector("#imp-cl").onclick = () => d.remove();
      d.querySelector("#imp-json").onchange = async e => {
        const f = e.target.files[0];
        if (!f) return;
        const st = d.querySelector("#imp-st");
        st.textContent = "Reading backup file and syncing to Google Drive…";
        try {
          const parsed = JSON.parse(await f.text());
          const memList = Array.isArray(parsed) ? parsed : (Array.isArray(parsed.members) ? parsed.members : Object.values(parsed.members || {}));
          for (const m of memList) {
            if (m && m.id) await store.set(m);
          }
          if (parsed.crm) {
            for (const col of ["sales", "expenses", "packages", "staff"]) {
              if (Array.isArray(parsed.crm[col]) && parsed.crm[col].length) {
                await cputs(col, parsed.crm[col]);
              }
            }
          }
          toast(`Imported ${memList.length} members into Google Drive ✔`, "ok");
          d.remove();
          await syncFromCloud(false);
        } catch (err) {
          st.innerHTML = '<span class="err">Invalid JSON file or upload error.</span>';
        }
      };
    }

    /* ============================================================================
       17. INITIALIZATION ON WINDOW LOAD
       ============================================================================ */
    window.onload = async function () {
      const savedTheme = ls.g("rcg_theme");
      if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);
      loadLocalState();

      try { creds = JSON.parse(ls.g("rcg_cred") || "null"); } catch (e) { creds = null; }
      role = creds && creds.user && API ? ls.g("rcg_role") : null;

      if (!role) {
        mphone = ls.g("rcg_member") || null;
        if (mphone) {
          role = "member";
          try { mmem = JSON.parse(ls.g("rcg_mcache") || "[]"); } catch (e) { mmem = []; }
        }
      }

      render();
      if (role) {
        await syncFromCloud(false);
      }
    };

  </script>
</body>
</html>
